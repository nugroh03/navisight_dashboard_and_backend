# go2rtc lokal — gateway transcode CCTV (PC lokal / subnet router Tailscale)
# Membaca channel 102 (sub stream yang juga direkam Shinobi; TIDAK diubah),
# decode H.265 di CPU, encode H.264 di GPU Intel (VAAPI, hanya mendukung CQP),
# lalu menyajikan RTSP untuk diambil go2rtc di VPS (lewat Tailscale).
# Kredensial dari /etc/go2rtc/go2rtc.env (CAM_USER, CAM_PASS, RTSP_USER, RTSP_PASS) via systemd EnvironmentFile.
# Stream hanya ditarik dari kamera saat ada penonton.

api:
  listen: "127.0.0.1:1984"     # hanya dari PC ini

rtsp:
  # Harus listen juga di localhost: exec {output} ffmpeg mengirim ke rtsp://127.0.0.1:8554.
  # Bind ke IP Tailscale saja membuat semua stream gagal (Connection refused).
  # UFW di PC ini nonaktif, jadi akses dari LAN dilindungi auth; localhost tanpa auth.
  # Dari Tailscale dibatasi ACL (tag:vps -> tag:cctv-router tcp:8554).
  listen: ":8554"
  username: "${RTSP_USER}"
  password: "${RTSP_PASS}"

webrtc:
  listen: ""                   # tidak dipakai di lokal

srtp:
  listen: ""                   # tidak dipakai (HomeKit)

log:
  level: info

streams:
  cam34:  "exec:ffmpeg -hide_banner -loglevel error -init_hw_device vaapi=va:/dev/dri/renderD128 -filter_hw_device va -fflags nobuffer -rtsp_transport tcp -i rtsp://${CAM_USER}:${CAM_PASS}@192.168.1.34:554/Streaming/Channels/102 -an -vf format=nv12,hwupload -c:v h264_vaapi -rc_mode CQP -qp 26 -g 20 -bf 0 -profile:v main -f rtsp {output}"
  cam43:  "exec:ffmpeg -hide_banner -loglevel error -init_hw_device vaapi=va:/dev/dri/renderD128 -filter_hw_device va -fflags nobuffer -rtsp_transport tcp -i rtsp://${CAM_USER}:${CAM_PASS}@192.168.1.43:554/Streaming/Channels/102 -an -vf format=nv12,hwupload -c:v h264_vaapi -rc_mode CQP -qp 26 -g 20 -bf 0 -profile:v main -f rtsp {output}"
